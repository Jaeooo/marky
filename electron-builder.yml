appId: com.jaewookim.marky
productName: Marky
copyright: Copyright © 2026 jaewookim

directories:
  buildResources: build

files:
  - out/**
  - resources/**
  - package.json
  # pdfjs-dist's optional Node canvas backend — unused (we render via the
  # browser Canvas API), pure dead weight, and its native binary breaks
  # codesigning.
  - '!node_modules/@napi-rs/**'

asarUnpack:
  - resources/**

fileAssociations:
  - ext: md
    name: Markdown Document
    role: Viewer
  - ext: markdown
    name: Markdown Document
    role: Viewer
  - ext: mdx
    name: MDX Document
    role: Viewer
  - ext: pdf
    name: PDF Document
    role: Viewer
  - ext: html
    name: HTML Document
    role: Viewer
  - ext: htm
    name: HTML Document
    role: Viewer

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  extendInfo:
    CFBundleDocumentTypes:
      - CFBundleTypeName: Markdown Document
        CFBundleTypeRole: Viewer
        LSHandlerRank: Alternate
        LSItemContentTypes:
          - net.daringfireball.markdown
          - public.plain-text
      - CFBundleTypeName: PDF Document
        CFBundleTypeRole: Viewer
        LSHandlerRank: Alternate
        LSItemContentTypes:
          - com.adobe.pdf
      - CFBundleTypeName: HTML Document
        CFBundleTypeRole: Viewer
        LSHandlerRank: Alternate
        LSItemContentTypes:
          - public.html

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

publish:
  provider: github
  owner: Jaeooo
  repo: marky
  # Drafts are invisible to the update feed, so publish straight away.
  releaseType: release
